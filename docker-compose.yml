services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loveletter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d loveletter"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build: .
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/loveletter
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    # This runs the push command, then starts your app
    command: sh -c "npx drizzle-kit push && node dist/index.cjs"